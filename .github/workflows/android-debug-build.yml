name: NEXA Android Debug Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'org.jetbrains.kotlin.plugin.compose") version "2.2.10"' build.gradle.kts
          echo "NEXA V0.3.2 toolchain preflight PASS"

      - name: Source regression preflight
        shell: bash
        run: |
          python3 tools/preflight_source.py
          python3 tools/test_runtime_search_regression.py

      - name: Build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon -PYOUTUBE_API_KEY="${{ secrets.NEXA_YOUTUBE_API_KEY }}" :app:assembleDebug --stacktrace --warning-mode all 2>&1 | tee build-live3.log

      - name: Verify APK and signing identity
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ls -lh "$APK"
          APKSIGNER="$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner"
          "$APKSIGNER" verify --print-certs "$APK" | tee signing-info.txt
          echo "Package: com.studiokinematics.nexa" >> signing-info.txt
          echo "NEXA V0.3.2 SEARCHFIX1 APK BUILD PASS"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-V0.3.2-SEARCHFIX1-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signing identity
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-V0.3.2-signing-info
          path: signing-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload build log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-V0.3.2-SEARCHFIX1-build-log
          path: build-live3.log
          if-no-files-found: ignore
          retention-days: 14
