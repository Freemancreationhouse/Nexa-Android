name: NEXA Android V0.4 Build

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK 36
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.6.0'

      - name: Verify toolchain
        shell: bash
        run: |
          set -euo pipefail
          java -version
          gradle --version
          test -f "$ANDROID_SDK_ROOT/platforms/android-36/android.jar"
          test -x "$ANDROID_SDK_ROOT/build-tools/36.0.0/aapt2"
          grep -q 'compileSdk = 36' app/build.gradle.kts
          grep -q 'targetSdk = 36' app/build.gradle.kts
          grep -q 'versionName = "0.4.0"' app/build.gradle.kts
          echo "NEXA V0.4 toolchain preflight PASS"

      - name: Source and architecture regression gates
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/preflight_source.py
          python3 tools/preflight_v04_release.py
          python3 tools/test_v04_core_contract.py
          python3 tools/test_runtime_search_regression.py
          python3 tools/test_v04_architecture_contract.py
          python3 tools/test_v04_ui_contract.py
          python3 tools/test_v04_offline_contract.py
          python3 tools/test_v04_billing_lyrics_contract.py

      - name: Test lint and build debug APK
        shell: bash
        run: |
          set -o pipefail
          gradle --no-daemon \
            -PYOUTUBE_API_KEY="${{ secrets.NEXA_YOUTUBE_API_KEY }}" \
            -PNEXA_PLUS_PRODUCT_ID="${{ vars.NEXA_PLUS_PRODUCT_ID }}" \
            :app:testDebugUnitTest :app:lintDebug :app:assembleDebug \
            --stacktrace --warning-mode all 2>&1 | tee build-v04.log

      - name: Verify APK and signing identity
        shell: bash
        run: |
          set -euo pipefail
          APK=app/build/outputs/apk/debug/app-debug.apk
          test -s "$APK"
          ls -lh "$APK"
          "$ANDROID_SDK_ROOT/build-tools/36.0.0/apksigner" verify --print-certs "$APK" | tee signing-info.txt
          echo "Package: com.studiokinematics.nexa" >> signing-info.txt
          echo "Owner: Studio Kinematic" >> signing-info.txt
          echo "NEXA V0.4 APK BUILD PASS"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-V0.4-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signing identity
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-V0.4-signing-info
          path: signing-info.txt
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: NEXA-V0.4-build-diagnostics
          path: |
            build-v04.log
            app/build/reports/**
          if-no-files-found: ignore
          retention-days: 14
